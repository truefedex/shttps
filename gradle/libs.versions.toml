[versions]
agp = "9.3.1"
shadow = "9.6.1"
kotlin = "2.4.10"
compose = "1.11.1"

proguard-annotations = "7.9.1"
jetbrains-annotations = "26.1.0"

junit5 = "5.9.2"
junit-platform5 = "1.9.2"
junit-bom = "6.0.1"

# instrumented Android tests run on a device, where the runner is JUnit 4 based
junit4 = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"

org-json = "20260814"
kxml = "2.3.0"

sqlite = "3.53.2.1"
slf4j = "2.0.18"
picocli = "4.7.7"
qrcodegen = "1.8.0"

# shttps-desktop (Compose Multiplatform)
navigation-compose = "2.9.2"
lifecycle-viewmodel-compose = "2.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
filekit = "0.11.0"
composenativetray = "1.3.3"
auto-launch = "0.8.0"

compile-sdk = "37"
min-sdk = "26"
target-sdk = "36"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }

[libraries]
proguard-annotations = { module = "com.guardsquare:proguard-annotations", version.ref = "proguard-annotations" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

junit5-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit5-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit5-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform5" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

json = { module = "org.json:json", version.ref = "org-json" }

kxml = { group = "net.sf.kxml", name = "kxml2", version.ref = "kxml"}

sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }

qrcodegen = { module = "io.nayuki:qrcodegen", version.ref = "qrcodegen" }

# shttps-desktop (Compose Multiplatform)
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-viewmodel-compose" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
composenativetray = { module = "io.github.kdroidfilter:composenativetray", version.ref = "composenativetray" }
auto-launch = { module = "io.github.vinceglb:auto-launch", version.ref = "auto-launch" }
