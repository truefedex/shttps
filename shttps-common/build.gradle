plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

dependencies {
    implementation project(path: ':server-lib')
    compileOnly libs.json
    compileOnly libs.kxml

    //org.json is provided by the platform at runtime (Android brings its own), and the xmlpull
    //API comes with the platform too, but tests need real implementations on their classpath
    testImplementation libs.json
    testImplementation libs.kxml
    testImplementation libs.junit5.jupiter.api
    testRuntimeOnly libs.junit5.jupiter.engine
    testRuntimeOnly libs.junit5.platform.launcher
}

test {
    useJUnitPlatform()
}