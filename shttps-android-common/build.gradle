plugins {
    id 'com.android.library'
}

android {
    namespace 'com.phlox.shttps_android_common'
    compileSdk Integer.parseInt(libs.versions.compile.sdk.get())

    defaultConfig {
        minSdk Integer.parseInt(libs.versions.min.sdk.get())

        consumerProguardFiles "consumer-rules.pro"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../shttps-common/shared-assets']
        }
    }
}

dependencies {
    implementation project(path: ':server-lib')
    implementation project(path: ':shttps-common')

    //DatabaseAndroid wraps the platform's own SQLiteDatabase - its transactions, its connection
    //pool and its cursors - so its tests have to run on a device rather than against a stub
    androidTestImplementation libs.junit4
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.runner
}