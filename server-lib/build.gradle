plugins {
    id 'java-library'
    id 'jacoco'
}

//Java 17 because Android compiles against this module and shttps-common, and 17 is as high as
//that side goes (D8 desugars its language features, min-sdk 26 has the APIs) - the two move together
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    api libs.proguard.annotations
    api libs.jetbrains.annotations

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
}

//coverage report: ./gradlew :server-lib:jacocoTestReport -> build/reports/jacoco/test/html/index.html
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}