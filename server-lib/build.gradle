plugins {
    id 'java-library'
    id 'jacoco'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_9
    targetCompatibility = JavaVersion.VERSION_1_9
}

dependencies {
    api libs.proguard.annotations
    api libs.jetbrains.annotations

    testImplementation libs.junit5.jupiter.api
    testRuntimeOnly libs.junit5.jupiter.engine
    testRuntimeOnly libs.junit5.platform.launcher
}

test {
    useJUnitPlatform()
}

//coverage report: ./gradlew :server-lib:jacocoTestReport -> build/reports/jacoco/test/html/index.html
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}