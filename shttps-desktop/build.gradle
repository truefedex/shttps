// Add build configuration to access version at runtime
tasks.register('generateBuildConfig') {
    doLast {
        def buildConfigDir = file("${layout.buildDirectory.asFile.get()}/generated/buildConfig")
        buildConfigDir.mkdirs()
        
        def buildConfigFile = new File(buildConfigDir, "BuildConfig.kt")
        buildConfigFile.text = """package com.phlox.simpleserver.buildconfig

object BuildConfig {
    const val VERSION_NAME = "${project.version}"
    const val VERSION_CODE = ${project.hasProperty('app.version.code') ? project.property('app.version.code') : '1'}
    const val APPLICATION_NAME = "Simple HTTP Server"
    const val BUILD_TYPE = "Desktop"
    const val PAID_VERSION = true
}
"""
    }
}

compileKotlin.dependsOn generateBuildConfig

compose.desktop {
    application {
        mainClass = "com.phlox.simpleserver.MainKt"
        nativeDistributions {
            modules("java.instrument", "java.sql", "jdk.security.auth", "jdk.unsupported")

            targetFormats(TargetFormat.Dmg, TargetFormat.Msi, TargetFormat.Deb, TargetFormat.Rpm)

            packageVersion = project.version.toString()
            packageName = "SHTTPS"
            description = "A simple HTTP server for sharing files and web prototyping."
            copyright = "2020-2025. Fedir Tsapana"
            vendor = "Fedir Tsapana"
            outputBaseDir.set(project.layout.buildDirectory.dir("../../builds"))

            windows {
                iconFile.set(project.file("src/main/resources/icons/app_icon.ico"))
                dirChooser = true
                perUserInstall = false
                upgradeUuid = "53dae249-9e99-4475-89d4-c563c69eebe9"
                menuGroup = "SHTTPS"
                shortcut = true
            }

            macOS {
                //The application's identity on macOS. Launch Services, the keychain and every TCC
                //permission grant are keyed on it, so changing it later makes the same app look
                //like a different one to the system - it is as fixed as the Windows upgradeUuid
                //above, and deliberately distinct from the PLUS build's so the two can coexist.
                bundleID = "com.phlox.simpleserver.desktop"
                dockName = "Simple HTTP Server"
                //macOS wants its own icon rather than the .ico: rounded rectangle, transparent
                //margin. Regenerated from markets/logo_square_1024.png by markets/macos/make_icns.sh
                iconFile.set(project.file("src/main/resources/icons/app_icon.icns"))
                appCategory = "public.app-category.developer-tools"
                //the floor of the Compose runtime; nothing in this build needs more
                minimumSystemVersion = "11.0"

                //Signing and notarization are deliberately not spelled out here. The Compose plugin
                //reads them from Gradle properties, so this same build produces an unsigned .dmg on
                //a machine without a certificate and a signed, notarized one on a machine with a
                //Developer ID - and no credential ever reaches the repository. Put them in
                //~/.gradle/gradle.properties (chmod 600 - the last one is a real password):
                //
                //  compose.desktop.mac.sign=true
                //  compose.desktop.mac.signing.identity=NAME (TEAMID)
                //  compose.desktop.mac.notarization.appleID=<apple id>
                //  compose.desktop.mac.notarization.password=<app specific password>
                //  compose.desktop.mac.notarization.teamID=TEAMID
                //
                //With the first two set, `packageDmg` signs the .app and the runtime inside it.
                //
                //It does NOT sign the disk image itself - jpackage stops at the bundle - so the
                //container signature, the notarization and the stapling are the last three steps
                //of the macos job in .github/workflows/build_n_release.yml, which reads the
                //notarization properties above and calls notarytool directly. They deliberately do
                //not go through the plugin's own `notarizeDmg`: codesigning a .dmg makes
                //packageDmg out of date, so that task would rebuild the image underneath and drop
                //the signature it was given. `notarizeDmg` still works if all you want is a
                //notarized image with an unsigned container.
                //
                //Two of those values are easy to get wrong and fail late:
                //
                //  * the identity is the *team or user portion only*, without the "Developer ID
                //    Application: " prefix. The plugin's own codesign call tolerates the full
                //    string, but it also passes the same property to jpackage as
                //    --mac-signing-key-user-name, which is documented as "team name" and prepends
                //    the certificate kind itself - so a full string there is searched for twice
                //    over and matches nothing.
                //  * the notarization password must be the literal app specific password. Both the
                //    workflow and AbstractNotarizationTask feed it to `notarytool submit` on stdin
                //    rather than as --password - keeping it out of the process list - so notarytool
                //    never sees it as an argument and the @keychain:ITEM and --keychain-profile
                //    forms it would otherwise accept are taken as the password itself.
                //
                //A Developer ID certificate also needs Apple's "Developer ID Certification
                //Authority" G2 intermediate in the same keychain, or the chain cannot be built and
                //`security find-identity -v -p codesigning` reports the identity as not valid.
                //Xcode installs it; a machine with only the Command Line Tools may not have it.
                //
                //There is no entitlements file either: the plugin's own default already carries
                //allow-jit, allow-unsigned-executable-memory and disable-library-validation, which
                //is exactly what a JVM under the hardened runtime needs - the last one because JNA
                //(composenativetray, filekit) unpacks its jnidispatch at runtime and dlopens it.
            }
        }
    }
}