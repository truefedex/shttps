name: Unit tests

# This file only ever runs in the open source repository (truefedex/shttps). GitHub reads workflows
# from .github/workflows at the *repository root*, and inside the umbrella project this directory
# is shttps-oss/.github, one level down - so the closed repository never picks it up, which is
# exactly what is wanted there. Paths below are relative to the OSS checkout root for that reason.
on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # All three desktop platforms, because several tests are OS specific and gated with JUnit
    # assumptions (RawDocumentFile*, CgiMiddlewarePathTest, the attributions platform filter):
    # a single Linux job would silently skip the Windows and macOS halves of them.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5

    # 21 is enough for every module: the Java 17 ones (server-lib, shttps-common, the Android
    # modules) compile with --release 17 on it, and foojay would provision anything else.
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # `test` across the whole build, Android modules included - the hosted images all carry an
    # Android SDK and export ANDROID_HOME, so no local.properties is needed. Instrumented tests
    # (shttps-android-common/src/androidTest) need a device and are deliberately not run here.
    # --continue so that a failure in one module still reports the results of all the others.
    - name: Run unit tests
      shell: bash
      run: ./gradlew test --continue --no-daemon

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports-${{ matrix.os }}
        path: |
          */build/reports/tests/
          */build/test-results/
        if-no-files-found: ignore
