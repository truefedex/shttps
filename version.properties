# The one place the application version is defined.
#
# Read by the settings.gradle of both builds in this repository: the shttps-oss build reads it
# directly, and the closed umbrella build reads it from here as well, so the Android app, the
# desktop app, the PLUS installer and the MSIX package all ship the same numbers and there is
# nothing to keep in sync at release time.
#
# It lives here rather than in the umbrella project because shttps-oss has to build standalone,
# and a composite build may only read downwards - the included build can never reach up.
#
# Not gradle.properties, because everything in that file is also a Gradle configuration knob for
# the build it sits in, and these two are application values that both builds need.
#
# app.version.name doubles as the MSIX package version, which the Store requires to be a four
# component number ending in .0 - see desktop-plus/msix.gradle, which appends the fourth component
# itself. Every Store submission needs this raised.
#
# shttps-commandline reads this too, as of 3.4.1. It used to carry its own hardcoded version on
# the theory that the jar ships on its own schedule; in practice it is built by the same workflow
# run as the installers, and it sat at 3.0.0 for four releases because nobody remembered it.
app.version.name=3.4.2
app.version.code=79
