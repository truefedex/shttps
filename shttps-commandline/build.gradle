plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow'
}

group = 'com.phlox.server'
//Same single source as the desktop and Android builds - ../version.properties, handed to every
//module as a project property by settings.gradle. This jar used to carry a hardcoded version on
//the theory that it ships on its own schedule; in practice it shipped from the same runs as the
//installers and quietly stayed at 3.0.0 while everything else moved on.
version = project.hasProperty('app.version.name') ? project.property('app.version.name') : '1.0-SNAPSHOT'

def mainClassName = "com.phlox.server.Main"

application {
    mainClass = mainClassName
}

dependencies {
    implementation project(path: ':server-lib')
    implementation project(path: ':shttps-common')
    implementation project(path: ':shttps-desktop-common')
    implementation libs.picocli
    annotationProcessor libs.picocli.codegen
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    manifest {
        attributes 'Main-Class': "$mainClassName"
        //What `shttps --version` prints, read back through Package.getImplementationVersion() so
        //the number is written down once. shadowJar inherits this manifest, so the fat jar carries
        //it too. See Main.ManifestVersion.
        attributes 'Implementation-Title': 'shttps'
        attributes 'Implementation-Version': project.version
        attributes 'Class-Path': configurations.compileClasspath.collect { it.getName() }.join(' ')
    }
}

compileJava {
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
}

shadowJar {
    // Include everything by default
    from(project.sourceSets.main.output)

    // Remove native libraries for platforms other than Windows and Linux
    exclude 'org/sqlite/native/FreeBSD/**'
    exclude 'org/sqlite/native/Linux-Android/**'
    //exclude 'org/sqlite/native/Linux-Musl/**'
    exclude 'org/sqlite/native/Mac/**'
}